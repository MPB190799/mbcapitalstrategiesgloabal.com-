      "@type": "Question",
      "name": "What is a hard asset investment?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Hard assets are physical or tangible investments — including shipping companies, mining stocks, energy producers, pipelines and REITs. They provide inflation protection, dividend income and real economic value. Examples: tanker fleets, copper mines, LNG terminals and office REITs."
      }
    },
    {
      "@type": "Question",
      "name": "What is Yield on Cost (YOC) and why does it matter?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yield on Cost (YOC) measures your personal dividend yield relative to your original purchase price. A YOC of 8% or above is Marco's quality threshold for hard-asset dividend stocks. As dividends grow over time, YOC can far exceed the current market yield."
      }
    },
    {
      "@type": "Question",
      "name": "What is a tanker stock and how do charter rates affect dividends?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Tanker stocks are shares in companies that own oil, product or LPG tankers. Charter rates (the daily hire price) directly drive revenues and therefore dividends. Higher spot rates = higher variable dividends. Leading examples: TORM, BW LPG, Dorian LPG, CMB.Tech."
      }
    },
    {
      "@type": "Question",
      "name": "What is free cash flow (FCF) and why is it the most important metric for dividend investors?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Free cash flow = operating cash flow minus capital expenditure. FCF is what's available to pay dividends, buy back shares or reduce debt. A FCF payout ratio below 80% signals a sustainable dividend. Highly leveraged companies can show profit but negative FCF — a key warning sign."
      }
    }
  ]
}
